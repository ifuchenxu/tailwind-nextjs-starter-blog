<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- 背景完全透明 -->

  <!-- 1. 左半边的大鱼（朱砂红） -->
  <path d="M 100 0 A 100 100 0 0 0 100 200 A 50 50 0 0 1 100 100 A 50 50 0 0 0 100 0 Z" fill="#CC0000" />

  <!-- 2. 右半边的大鱼（明黄色） -->
  <path d="M 100 0 A 100 100 0 0 1 100 200 A 50 50 0 0 1 100 100 A 50 50 0 0 0 100 0 Z" fill="#FFD700" />

  <!-- 3. 确保在最上层点睛： -->
  <!-- 在红色的鱼头里，点一颗黄色的眼 -->
  <circle cx="100" cy="50" r="16" fill="#FFD700" />

  <!-- 在黄色的鱼头里，点一颗红色的眼 -->
  <circle cx="100" cy="150" r="16" fill="#CC0000" />
</svg>
